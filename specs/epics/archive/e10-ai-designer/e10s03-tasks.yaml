    description: >-
      Env gate: /api/ai-design returns 503 { error: "ai_disabled" } unless a
      provider is configured (OPENAI_API_KEY present OR AI_BASE_URL set) AND
      AI_MODEL is set. Env vars documented in README (dev section).
    verify: pnpm test -- src/app/api/ai-design && pnpm lint
    risk: P1
    status: passing
    allure:
      severity: high
      categories:
        - api
        - security
  - id: 2
    description: >-
      Best-effort in-memory rate limit: sliding window per client IP (~10 req /
      10 min) → 429. Honest limitation documented (per-instance, not bulletproof
      across serverless) in a code comment and README.
    verify: pnpm test -- src/app/api/ai-design
    risk: P1
    status: passing
    allure:
      severity: high
      categories:
        - api
        - security
  - id: 3
    description: >-
      Output caps: maxTokens (~1000) on the model call + design sanity cap
      (totalPerMonth ≤ 1,000,000,000 and item counts within builder caps)
      enforced server-side.
    verify: pnpm test -- src/app/api/ai-design
    risk: P2
    status: passing
    allure:
      severity: normal
      categories:
        - api
        - security
