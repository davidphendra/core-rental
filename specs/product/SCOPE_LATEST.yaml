# Scope — Core Rental v1.12.0 initiative (SCOPE_LATEST)

core_value: >
  Let a user describe the workspace they want in plain language — "fancy gaming
  workspace, max Rp 30 juta" — and have the app design it for them: the AI
  searches the real catalog, respects the budget, and populates the builder in
  one click.

summary: >
  v1.12.0 adds a "Design with AI" capability to the workspace builder. The user
  types a free-form request; a new API route sends it to an LLM via the Vercel
  AI SDK; the model interprets the request and discovers products by calling
  tools (searchCatalog, getSetupTotal, finalizeDesign) rather than guessing —
  every returned product is a real catalog SKU fetched through a tool. The
  route validates the final design against the catalog (SKU exists, category
  matches the builder slot, caps respected, budget re-verified server-side) and
  returns a strict JSON design plus a short plain-language note. The builder
  shows the design as a preview card with the AI's reasoning trail, and Apply
  replaces the current setup (with a confirm when the cart is non-empty) using
  the existing builder reducers — no new cart state.

  The LLM is provider-switchable via environment variables: LM Studio's
  OpenAI-compatible endpoint (http://localhost:1234/v1) in local development —
  an officially supported provider — and OpenAI's API in production. The AI
  feature is env-gated (off unless a key/model is configured), protected by a
  best-effort rate limit and a hard output cap, and emits only non-PII
  observability events (request timing/tool counts, applied design SKUs and
  total) — never the user's prompt text.

  The initiative ships with unit tests (mocked LLM provider) and E2E coverage
  (stubbed route) so CI stays green without real API calls, and follows the
  project's TDD + preflight + version-bump conventions. No changes are pushed
  to origin until an explicit release signal.

in_scope:
  - id: e10s01
    title: "AI design API route"
    detail: >
      A POST /api/ai-design route using the Vercel AI SDK. The LLM interprets a
      natural-language request and calls tools to search the catalog (by
      keyword/category/price), sum candidate totals for budget checking, and
      finalize a design. Output is strict structured JSON matching the builder
      schema: one chair, one desk, up to three monitors, at most one each of
      coffee/beanbag/lamp/plant, a computed monthly total, and a plain-language
      note. The route validates every SKU server-side (exists in the catalog,
      correct slot/category, caps respected) and re-verifies the budget total
      when a budget is stated; validation failures auto-retry once, then return
      a clear error. An impossible budget yields an honest refusal with the
      cheapest valid alternatives rather than a forced design.
  - id: e10s02
    title: "Builder 'Design with AI' panel"
    detail: >
      A panel on the builder page: free-text input, generate action with a
      60-second timeout and cancel, and a preview card showing the proposed
      items, monthly total, the AI's note, and the tool-call reasoning trail.
      Apply loads the design into the builder via the existing reducers,
      replacing the current setup after a confirmation when the cart is
      non-empty. Provider-unavailable, rate-limited, and invalid-output states
      degrade gracefully with actionable messages and leave the current builder
      untouched.
  - id: e10s03
    title: "AI observability, guardrails & verification"
    detail: >
      Env-gated enablement (route disabled without a configured model/key),
      best-effort in-memory rate limiting, and a hard output cap on the route.
      Non-PII observability events emitted through the existing logger
      (ai.request with model/timing/tool counts; ai.design_applied with applied
      SKUs and total) — the user's prompt text is never emitted. Unit tests
      with a mocked LLM provider, E2E with a stubbed route, preflight and CI
      green, and a minor version bump.

out_of_scope:
  - id: chat
    title: "Multi-turn conversational chat"
    reason: >
      Deferred. v1 is single-shot: type a request, get a design, refine by
      editing the prompt and regenerating. A persistent chat thread is a
      larger UX surface with no clear demo payoff yet.
  - id: streaming
    title: "Streaming LLM responses"
    reason: >
      Deferred. v1 returns the completed design (with the tool trail revealed
      step-by-step client-side). Streaming is a polish item after the
      non-streaming path proves out.
  - id: auth
    title: "Real authentication / per-user limits"
    reason: >
      The demo has no auth by design. Guardrails are demo-lite (env gate,
      best-effort in-memory rate limit, output cap); enterprise-grade
      distributed limiting needs paid infrastructure not justified for a demo.
  - id: rag
    title: "Embedding-based retrieval over the catalog"
    reason: >
      Overkill for 63 products. Tool-based discovery already guarantees
      hallucination-free SKUs and keeps prompts small.
  - id: new-products
    title: "New product types (computer, sofa, …)"
    reason: >
      The AI is constrained to the existing catalog (chair/desk/monitor/lamp/
      plant/coffee/beanbag). Adding product types is a separate catalog +
      builder initiative.
  - id: history
    title: "AI design history / favorites"
    reason: >
      Deferred. v1 keeps no record of past designs beyond the applied cart.

constraints:
  - "No code is pushed to origin until the user gives an explicit release signal (brainstorming constraint)."
  - "TDD: every change starts RED, unit tests mock the LLM provider; no real API calls in CI."
  - "Gates run by name at build/verify time: build-epic step 6 audit-code --gate (CONVENTIONS compliance, SOLID, test coverage, Boy Scout, supply-chain slopcheck) and verify-work phase-5 security-review; F.I.R.S.T test rubric applies to all new tests."
  - "Architecture records: ADR 0007 (AI design route — provider-switchable LLM, tool-based discovery, validation trust boundary) and specs/security/epics/e10/THREAT_MODEL.md are produced with the epic; new code follows CONVENTIONS.md (TS, E1–E4, O1–O4, a11y #24)."
  - "preflight (test+lint+typecheck+build), full E2E, and CI must stay green."
  - "PII guard: the user's prompt text is never emitted to logger or analytics; observability emits SKUs/prices/timings only."
  - "The OpenAI API key lives in server-side env vars only; never shipped to the client."
  - "The builder schema is rigid: 1 chair + 1 desk + ≤3 monitors + ≤1 each coffee/beanbag/lamp/plant. AI output must map onto it."
  - "Prices are monthly IDR; a stated budget is a monthly-total ceiling, tool-checked and server-re-verified."
  - "Deps: Vercel AI SDK (ai@^7), @ai-sdk/openai (or -compatible) @^4, zod peer; LM Studio localhost:1234/v1 for dev, OpenAI API for prod."
  - "This is a feature: minor version bump on release."

success_criteria:
  - "A user can type a plain-language request (e.g., 'fancy gaming workspace, max Rp 30 juta') in the builder and apply a validated design within seconds."
  - "Every applied SKU exists in the catalog and lands in the correct builder slot — zero hallucinated products (tools + server validation)."
  - "When a budget is stated, the applied design's monthly total never exceeds it (server-verified); impossible budgets produce an honest refusal with alternatives, not a forced design."
  - "Applying a design replaces the current setup only after confirmation when the cart is non-empty; the existing cart is otherwise untouched."
  - "Provider-down / rate-limited / invalid-output states show actionable errors and leave the builder intact."
  - "ai.request and ai.design_applied events fire with no prompt text; unit + E2E suites pass; preflight and CI green."

