# Scope — Core Rental v1.9.0 initiative (SCOPE_LATEST)

core_value: >
  Give every product a real, stable system identity (a 12-character SKU) and
  make the workspace builder more direct — three discrete monitor slots with
  any model mix, one-click chair/desk selection, and clear icons — so
  designing and renting a Bali office stays a three-minute, visual experience.

summary: >
  v1.9.0 is one combined release that hardens the catalog identity and the
  builder UX. Products trade their readable slug ids (chair-uluwatu-chair,
  accessory-monitor-…) for a 12-character alphanumeric SKU built from a
  3-letter category code plus a 9-character deterministic hash of the product
  name. The SKU is the system identifier used by the cart, validation,
  persistence, tests, and E2E. The builder gains three discrete monitor slots
  (exactly one monitor each, any combination of models up to 3 total), a
  monitor icon on the Add Monitor button, and clickable Add-chair / Add-desk
  hints that select the first product of that category.

  The four changes ship together because they touch the same code: the cart
  state shape, the catalog schema, the validation trust boundary, the
  localStorage key, and the E2E fixtures all move at once, avoiding
  intermediate broken states and a single storage-key bump. Old persisted
  carts are intentionally dropped (fresh defaults) — mapping old ids to new
  SKUs is infeasible with opaque, regenerated identifiers.

in_scope:
  - id: e09s01
    title: "Product SKU system"
    detail: >
      Replace the product id with a 12-character alphanumeric SKU (3-letter
      category/subtype code + 9-char deterministic hash of the product name).
      Codes: CHA chair, DSK desk, MON monitor, LMP lamp, PLT plant, CFE coffee,
      BBG beanbag, EXT extra, PTN partner. Cap identity (monitor/lamp/plant/
      coffee/beanbag) is preserved and enforced via the new scheme. The
      catalog generator and curated hero overlay emit SKUs deterministically
      (byte-stable across regenerations). Image assets are decoupled from the
      SKU so product URLs stay stable. Catalog validation checks the 12-char
      format, a known code, and uniqueness.
  - id: e09s02
    title: "Three monitor slots"
    detail: >
      The builder holds up to 3 monitors, one per discrete slot. Selecting a
      monitor fills the first empty slot; when all three are full, selecting
      again replaces the most-recently-added slot with a brief visual
      highlight; selecting a monitor already placed is a no-op. Any model
      combination is allowed (1A+1B+1C, 2A+1B, 3C, …). Each slot can be
      cleared individually with ×. Fresh carts start with all three slots
      empty; the total monitor cap stays 3.
  - id: e09s03
    title: "Builder direct-selection polish"
    detail: >
      The Add Monitor empty button uses a monitor icon. The empty chair and
      desk hints become clickable buttons with chair/desk icons that select
      the first chair / first desk in the catalog — the same one-click
      shortcut the accessory slots already provide.

out_of_scope:
  - item: Migrating old persisted carts (old-id → new-SKU mapping)
    why: "Storage key is bumped; old carts reset to fresh defaults. Opaque regenerated SKUs make id mapping infeasible; demo-verify already clears carts on rent."
  - item: Monitor quantity steppers or per-slot multiple monitors
    why: "Replaced by the discrete 1-monitor-per-slot model (grilled decision)."
  - item: More than 3 monitor slots / variable slot count
    why: "User fixed the design at exactly 3 slots."
  - item: SKUs exposed in URLs or routing
    why: "No route depends on product ids today; the SKU stays an internal system id."
  - item: Icon changes for the other slots (lamp/plant/coffee/beanbag)
    why: "Only the monitor and the chair/desk hints were requested; rest untouched to limit churn."
  - item: Payment / real checkout / backend / accounts (unchanged from v1.0)
    why: "Decision #4/#5 — demo-honest mock confirmation, static JSON."
  - item: i18n, dark mode, real product photography (unchanged from v1.0)
    why: "Decisions #2/#8/#31 — deferred, tokens retained."

constraints:
  - One combined release; semantic version bumps 1.8.0 → 1.9.0.
  - SKUs: exactly 12 characters, letters and digits only, unique per product.
  - SKU generation is deterministic — regenerating the catalog is byte-stable.
  - LocalStorage key is bumped; old carts hydrate to D1 defaults, never crash.
  - "All gates must pass: preflight (unit + lint + typecheck + build), full E2E, and the 80% branch coverage gate on shared/domain."
  - Records updated: DECISION_RECORD change log + specs/state.yaml.
  - "Existing conventions hold: Tailwind v4 CSS-first, strict input validation, PII-free logging, error boundaries."

success_criteria:
  - products.json contains only skuNo (12 alnum, known-code prefixes, unique); no id field remains.
  - Caps (monitor 3, lamp 2, plant 4, coffee 1, beanbag 2) hold under the SKU scheme; the previous hero-plant cap quirk is gone.
  - The builder renders 3 monitor slots; (1A+1B+1C), (2A+1B), (3C) are all buildable; full-slots + Select replaces the most-recently-added card with a visible highlight; selecting an already-placed monitor is a no-op; × clears a slot.
  - Add Monitor shows the monitor icon; empty chair/desk hints are clickable buttons (chair/desk icons) that select the first chair/desk.
  - Old localStorage carts reset to defaults cleanly (no crash, no invalid state).
  - Full unit + E2E suites pass with updated skuNo/monitorSlots/button matchers; preflight exit 0.

