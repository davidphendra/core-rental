      summary: Extras (surfboard) products removed from the catalog data itself — the generator no longer emits them and the curated hero entry is gone; catalog is now 53 products (10 chairs / 10 desks / 32 accessories / 1 partner).
    - date: 2025
      summary: Selected chair and desk now removable via top-left × buttons on the workspace (like the other product cards); deselect actions + panel Select/Deselect toggle rebuilt, D1 defaults apply once per mount.
    - date: 2025
      summary: Fixed the chair/desk × placement — the product boxes now match the 4:3 SVG aspect (chair 192x144, desk 128x96) so the × sits on the product instead of the letterbox margin.
    - date: 2025
