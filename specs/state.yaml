    - date: 2025
      summary: Fixed filled canvas slot positioning — the filled monitor/lamp/plant buttons carried both relative and absolute classes (relative won, items jumped to the top-right). relative is now zone-only; canvas slots stay absolute at their slot position.
    - date: 2025
      summary: Workspace canvas tightened — inner flex height reduced from 440px to 300px, removing ~140px of dead space above the monitor (201px → 61px of normal padding); all slots keep their relative layout, no overlaps, desk legs visible.
    - date: 2025
      summary: Added a SiteFooter on every page showing the current app version (git semantic version via scripts/version.ts + prebuild hook, e.g. v1.7.0), centered.
    - date: 2025
      summary: Summary page bottom spacing tightened — removed min-h-screen (content now hugs the footer, 259px → 72px gap after Rent); root body carries bg-background for a seamless page.
    - date: 2025
      summary: Home + store pages got the same bottom-spacing treatment — min-h-screen removed (home also dropped its mobile-only h-24 spacer), store main pb-32 → pb-4; footer now sits ~32-48px after the content.
    - date: 2025
      summary: Home pre-footer spacing fixed — HowItWorks bottom padding cut from section-gap (80px) to pb-4; the dead space before the footer dropped 136px → 72px.
    - date: 2025
      summary: Stepper + / - buttons are now 32x32 circles (Button size circle), matching the home page's circular add button; the shared Button owns the radius per size.
    - date: 2025
      summary: Canvas slots got direct removal — a × button on filled monitor/lamp/plant/coffee/beanbag cards decrements the quantity (empties at 1), so items can be removed without going back to the panel steppers.
    - date: 2025
      summary: Extras category removed from the builder and store — builder panel is now Chairs/Desks/Accessories (coffee/beanbag managed on the canvas zones); the store browses Chairs/Desks/Accessories only (surfboard family + partner unlisted).
