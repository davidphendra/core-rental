      summary: Add Lamp slot relocated from right-40 to left-12 — it overlapped the centered desk image (96x96px); the bottom row is now Lamp | Desk | Plant, all clear with ~16px gaps.
    - date: 2025
      summary: Add Monitor slot moved down from the canvas top to bottom-36 — now centered just above the desk (24px gap), between the lamp and plant, so all four elements cluster together.
